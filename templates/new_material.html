{% extends "base.html" %}
{% block title %}New Material — BMAC{% endblock %}
{% block content %}
<h1>New Material</h1>
<form method="post" action="/materials/new">
    <label>Material ID</label>
    <input type="text" name="material_id" placeholder="e.g. CAT-NMC-002" required>

    <label>Chemistry</label>
    <input type="text" name="chemistry" required>

    <label>Supplier</label>
    <input type="text" name="supplier" required>

    <button type="submit">Create Material</button>
</form>

{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if success %}<p class="success">Created {{ success }} successfully.</p>{% endif %}
{% endblock %}
