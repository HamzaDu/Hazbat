{% extends "base.html" %}
{% block title %}New MLP Cell — BMAC{% endblock %}
{% block content %}
<h1>New MLP Cell</h1>
<form method="post" action="/mlp/new">
    <label>MLP ID</label>
    <input type="text" name="mlp_id" placeholder="e.g. MLP-0002" required>

    <label>Cathode Coating ID</label>
    <input type="text" name="cat_coating_id" placeholder="Must already exist" required>

    <label>Anode Coating ID</label>
    <input type="text" name="an_coating_id" placeholder="Must already exist" required>

    <label>Project</label>
    <input type="text" name="project" required>

    <button type="submit">Create MLP Cell</button>
</form>

{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if success %}<p class="success">Created {{ success }} successfully.</p>{% endif %}
{% endblock %}
