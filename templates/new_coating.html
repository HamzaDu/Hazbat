{% extends "base.html" %}
{% block title %}New Coating — BMAC{% endblock %}
{% block content %}
<h1>New Coating</h1>
<form method="post" action="/coatings/new">
    <label>Coating ID</label>
    <input type="text" name="coating_id" placeholder="e.g. CAT-NMC-001-C002" required>

    <label>Material ID</label>
    <input type="text" name="material_id" placeholder="Must already exist" required>

    <label>Project</label>
    <input type="text" name="project" required>

    <label>Made By</label>
    <input type="text" name="made_by" required>

    <button type="submit">Create Coating</button>
</form>

{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if success %}<p class="success">Created {{ success }} successfully.</p>{% endif %}
{% endblock %}
