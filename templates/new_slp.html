{% extends "base.html" %}
{% block title %}New SLP Cell — BMAC{% endblock %}
{% block content %}
<h1>New SLP Cell</h1>
<form method="post" action="/slp/new">
    <label>SLP ID</label>
    <input type="text" name="slp_id" placeholder="e.g. CAT-NMC-001-C001-SLP-02" required>

    <label>Coating ID</label>
    <input type="text" name="coating_id" placeholder="Must already exist" required>

    <label>Project</label>
    <input type="text" name="project" required>

    <label>Made By</label>
    <input type="text" name="made_by" required>

    <label>Formation Capacity (mAh)</label>
    <input type="number" step="0.1" name="formation_capacity">

    <button type="submit">Create SLP Cell</button>

</form>

{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if success %}<p class="success">Created {{ success }} successfully.</p>{% endif %}
{% endblock %}
