{% extends "base.html" %}
{% block title %}Two-factor authentication — BMAC{% endblock %}
{% block content %}
<div class="login-card">
<div class="login-logo"><img src="/static/img/wmg-colour.png" alt="WMG, University of Warwick"></div>
<h1>Two-factor authentication</h1>
<p class="login-sub">Enter the code from your authenticator app, or one of your recovery codes.</p>
<form method="post" action="/2fa/verify">
    <label>Code</label>
    <input type="text" name="code" autocomplete="one-time-code" autofocus required>

    <button type="submit">Verify</button>
</form>

{% if error %}<p class="error">{{ error }}</p>{% endif %}
<p class="login-sub"><a href="/login">Back to login</a></p>
</div>
{% endblock %}
