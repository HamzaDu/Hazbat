{% extends "base.html" %}
{% block title %}New Coin Cell — BMAC{% endblock %}
{% block content %}
<h1>New Coin Cell</h1>
<form method="post" action="/coincell/new">
    <label>Coin Cell ID</label>
    <input type="text" name="coincell_id" placeholder="e.g. CAT-NMC-001-C001-CC-02" required>

    <label>Coating ID</label>
    <input type="text" name="coating_id" placeholder="Must already exist" required>

    <label>Project</label>
    <input type="text" name="project" required>

    <label>Made By</label>
    <input type="text" name="made_by" required>

    <button type="submit">Create Coin Cell</button>
</form>

{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if success %}<p class="success">Created {{ success }} successfully.</p>{% endif %}
{% endblock %}
