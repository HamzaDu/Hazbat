# Dev-only settings for the dev container. NOT for production.
# Every setting is present, because this file is mounted into the container and cannot be rewritten there.

[database]
host = localhost
port = 5432
name = bmac
admin_password = dev
read_write_password = dev
read_only_password = dev

[app]
base_url = http://localhost:8000
session_secret = dev-only-session-secret
two_factor_key = dev-only-two-factor-key
max_2fa_interval_hours = 48
disable_2fa = true
